<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document Generation</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

        <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
            <div class="container-fluid">
                <div class="navbar-brand fs-4" >
                    Document Generation
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <h2 class="text-center mb-5">
                Upload Your Project Files
            </h2>

            <div class="row justify-content-center">
                <div class="col-md-5 mb-4">
                    <div class="card shadow text-center p-4 upload-card">
                        <h4 class="mt-3">
                            Upload Architecture Image
                        </h4>
                        <label for="architectureImage" class="upload-area mt-4">
                            <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                            <h6 class="mb-1">Click to Upload</h6>
                            <p class="text-muted">PNG, JPG, JPEG</p>
                        </label>

                        <input type="file" id="architectureImage" accept="image/*" hidden>

                        <p id="architectureFileName" class="mt-2 text-success fw-semibold"></p>

                    </div>
                </div>

                <!-- Document Upload -->
                <div class="col-md-5 mb-4">
                    <div class="card shadow text-center p-4 upload-card">
                        <h4 class="mt-3">
                           Upload Requirement Document
                        </h4>
                       <label for="requirementDocument" class="upload-area mt-4">
                            <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                            <h6 class="mb-1">Click to Upload</h6>
                            <p class="text-muted">PDF, DOC, DOCX</p>
                        </label>

                        <input type="file" id="requirementDocument" accept=".pdf,.doc,.docx" hidden>

                        <p id="documentFileName" class="mt-2 text-success fw-semibold"></p>
                    </div>
                </div>
            </div>

            <!-- GitHub Repository -->
            <div class="row justify-content-center mt-3">
                <div class="col-md-10">
                    <div class="card shadow p-4">
                        <h4 class="mb-4">
                            GitHub Repository
                        </h4>
                        <label class="form-label fw-semibold">
                            Repository URL
                        </label>
                        <input
                            type="url"
                            class="form-control"
                            id="githubUrl"
                            placeholder="https://github.com/username/repository">
                        <small class="text-muted">
                            Provide the GitHub repository URL to analyze the source code.
                        </small>
                    </div>
                </div>
            </div>

            <!-- Code Snippet -->
            <div class="row justify-content-center mt-4">
                <div class="col-md-10">
                    <div class="card shadow p-4">
                        <h4 class="mb-4">
                            Code Snippet
                        </h4>
                        <label class="form-label fw-semibold">
                            Paste Source Code
                        </label>
                        <textarea
                            class="form-control"
                            id="codeSnippet"
                            rows="10"
                            placeholder="Paste your source code here...">
                        </textarea>
                        <!-- <small class="text-muted">
                            You can paste a small code snippet if you don't want to provide a GitHub repository.
                        </small> -->
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <button id="generateBtn" class="btn btn-dark btn-lg px-5">
                    Generate Documentation
                </button>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        <script src="{{ url_for('static', path='/js/script.js') }}"></script>
    </body>
